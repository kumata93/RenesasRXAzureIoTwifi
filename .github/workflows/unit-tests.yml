name: Unit Tests (Unity)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  unity-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and run Unity unit tests
        run: |
          mkdir -p test/build
          gcc -std=gnu99 -Wall -Wextra -Wno-unused-parameter \
            -DUNITY_SUPPORT_64 \
            -Itest/unity -Itest/mocks -Isrc \
            test/unity/unity.c \
            test/mocks/mock_env.c \
            src/nx_driver_rx_wifi.c \
            src/sample_network.c \
            src/compat.c \
            src/demo_printf.c \
            test/test_nx_driver_rx_wifi.c \
            test/test_app_utils.c \
            test/test_main.c \
            -o test/build/unit_tests
          ./test/build/unit_tests
